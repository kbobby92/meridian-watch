name: Publish site with live traffic

# Rebuilds the site every 10 minutes with a fresh aircraft (and vessel) snapshot,
# and whenever main changes (for example the twice-daily briefing data refresh).
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch live traffic snapshot
        run: node tools/fetch_traffic.mjs
        continue-on-error: true
        env:
          AISSTREAM_KEY: ${{ secrets.AISSTREAM_KEY }}
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
      - name: Fetch breaking news
        run: node tools/fetch_news.mjs
        continue-on-error: true
      - name: Check briefing data
        run: |
          # If data.json was published malformed or incomplete, keep serving the last good copy.
          if ! node -e 'const d=JSON.parse(require("fs").readFileSync("data.json","utf8")); for (const k of ["hotspots","news","timeline","chokepoints","markets","measures"]) if (!Array.isArray(d[k]) || !d[k].length) throw new Error("missing " + k);'; then
            echo "data.json is invalid; restoring the copy currently live on the site"
            curl -fsSL "https://kbobby92.github.io/meridian-watch/data.json" -o data.json
          fi
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html data.json README.md .nojekyll _site/
          for f in aircraft.json ships.json breaking.json; do [ -f "$f" ] && cp "$f" _site/ || true; done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
